<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Go to My Recognition? 🐱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ffb6d9 0%, #ffc0e0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }

        .cat-image {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .cat-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #ff69b4;
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .yes-btn {
            background-color: #4CAF50;
            color: white;
        }

        .yes-btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        .no-btn {
            background-color: #ff6b6b;
            color: white;
        }

        .no-btn:hover {
            background-color: #ff5252;
            transform: scale(1.05);
        }

        .secondary-btn {
            background-color: #ff69b4;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
        }

        .secondary-btn:hover {
            background-color: #ff1493;
            transform: scale(1.05);
        }

        .success-message {
            display: none;
            font-size: 48px;
            color: #ff69b4;
            margin: 20px 0;
            animation: bounce 0.6s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
        }

        .cat-image.wiggle {
            animation: wiggle 0.5s ease;
        }

        #initialButtons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        #secondaryButtons {
            display: none;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

        <h1>Would you go to my recognition? 🎉</h1>

        <div class="button-group">
            <div id="initialButtons">
                <button class="yes-btn" onclick="clickYes()">Yes</button>
                <button class="no-btn" onclick="clickNo()">No</button>
            </div>

            <div id="secondaryButtons">
                <button class="secondary-btn" onclick="nextQuestion()">Are you sure?</button>
                <button class="secondary-btn" onclick="nextQuestion()">Are you really sure?</button>
                <button class="secondary-btn" onclick="nextQuestion()">baby, please</button>
                <button class="secondary-btn" onclick="nextQuestion()">aaa don't do dis to me</button>
                <button class="secondary-btn" onclick="nextQuestion()">no way u're breaking my heart !!!</button>
                <button class="yes-btn" onclick="clickYes()">YES YOU WILL</button>
            </div>
        </div>

        <div class="success-message" id="successMessage">
            YAAAYYY!! :3
        </div>
    </div>

    <script>
        let stage = 'initial';

        function clickYes() {
            const catImage = document.getElementById('catImage');
            catImage.classList.add('wiggle');
            
            document.getElementById('initialButtons').classList.add('hidden');
            document.getElementById('secondaryButtons').classList.add('hidden');
            
            const successMsg = document.getElementById('successMessage');
            successMsg.style.display = 'block';
            
            // Remove wiggle animation class after it completes
            setTimeout(() => {
                catImage.classList.remove('wiggle');
            }, 500);
        }

        function clickNo() {
            document.getElementById('initialButtons').classList.add('hidden');
            document.getElementById('secondaryButtons').classList.remove('hidden');
            stage = 'secondary';
        }

        function nextQuestion() {
            // This handles the secondary button clicks
            // They all lead to the YES YOU WILL button being shown
            clickYes();
        }
    </script>
</body>
